
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <title>Nueva contraseña · GPU LAB</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth">
    <div class="brand">GPU <b>LAB</b><small>2.0</small></div>

    <h1>Restablecer contraseña</h1>
    <p>Escribe tu nueva contraseña para acceder como profesor.</p>

    <form id="resetForm">
      <label for="password">Nueva contraseña</label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <label for="confirmPassword">Confirmar contraseña</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button type="submit">Guardar nueva contraseña</button>

      <div id="message" class="msg" role="status"
        aria-live="polite"></div>
    </form>
  </main>

  <script src="vendor/supabase.js"></script>

  <script type="module">
    import { db } from './js/auth/session.js';

    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        message.className = 'msg bad';
        message.textContent =
          'La contraseña debe tener al menos 8 caracteres.';
        return;
      }

      if (password !== confirmPassword) {
        message.className = 'msg bad';
        message.textContent = 'Las contraseñas no coinciden.';
        return;
      }

      message.className = 'msg';
      message.textContent = 'Guardando nueva contraseña...';

      try {
        const { data, error } = await db.auth.updateUser({
          password
        });

        if (error || !data.user) {
          throw error || new Error('No se pudo actualizar la contraseña.');
        }

        message.className = 'msg ok';
        message.textContent =
          'Contraseña actualizada correctamente. Ya puedes ingresar.';

        await db.auth.signOut();

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);

      } catch (error) {
        console.error('Error al cambiar contraseña:', error);
        message.className = 'msg bad';
        message.textContent =
          'No se pudo cambiar la contraseña. Solicita un nuevo enlace de recuperación.';
      }
    });
  </script>
</body>
</html>
