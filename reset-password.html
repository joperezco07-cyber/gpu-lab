
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <title>Nueva contraseña · GPU LAB</title>
  <link rel="stylesheet" href="css/auth.css">
</head>

<body>
  <main class="auth">
    <div class="brand">GPU <b>LAB</b><small>2.0</small></div>

    <h1>Restablecer contraseña</h1>
    <p>Escribe tu nueva contraseña para acceder como profesor.</p>

    <form id="resetForm" hidden>
      <label for="password">Nueva contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <label for="confirmPassword">Confirmar contraseña</label>
      <input
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button id="saveButton" type="submit">
        Guardar nueva contraseña
      </button>
    </form>

    <div
      id="message"
      class="msg"
      role="status"
      aria-live="polite"
    >
      Verificando enlace de recuperación...
    </div>
  </main>

  <script src="vendor/supabase.js"></script>

  <script type="module">
    import { db } from './js/auth/session.js';

    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const saveButton = document.getElementById('saveButton');

    let recoveryReady = false;

    function showMessage(type, text) {
      message.className = 'msg ' + type;
      message.textContent = text;
    }

    async function initializeRecovery() {
      try {
        showMessage('', 'Verificando enlace de recuperación...');

        const params = new URLSearchParams(
          window.location.search
        );

        const hashParams = new URLSearchParams(
          window.location.hash.substring(1)
        );

        // Detectar errores enviados por Supabase.
        const authError =
          params.get('error_description') ||
          hashParams.get('error_description');

        if (authError) {
          throw new Error(authError);
        }

        // Recuperación mediante PKCE.
        const code = params.get('code');

        if (code) {
          const { error } =
            await db.auth.exchangeCodeForSession(code);

          if (error) throw error;
        }

        // Recuperación mediante token_hash.
        const tokenHash = params.get('token_hash');

        if (tokenHash) {
          const { error } = await db.auth.verifyOtp({
            token_hash: tokenHash,
            type: 'recovery'
          });

          if (error) throw error;
        }

        // Recuperación mediante tokens en el fragmento URL.
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');
        const tokenType = hashParams.get('type');

        if (
          accessToken &&
          refreshToken &&
          tokenType === 'recovery'
        ) {
          const { error } = await db.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });

          if (error) throw error;
        }

        // Comprobar que Supabase tenga una sesión válida.
        const { data, error } = await db.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          throw new Error(
            'No se encontró una sesión de recuperación válida.'
          );
        }

        recoveryReady = true;
        form.hidden = false;

        showMessage(
          'ok',
          'Enlace verificado. Ya puedes establecer tu nueva contraseña.'
        );

      } catch (error) {
        console.error(
          'Error verificando recuperación:',
          error
        );

        recoveryReady = false;
        form.hidden = true;

        showMessage(
          'bad',
          'El enlace no es válido o ha caducado. Solicita uno nuevo.'
        );
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!recoveryReady) {
        showMessage(
          'bad',
          'Primero debes verificar el enlace de recuperación.'
        );
        return;
      }

      const password =
        document.getElementById('password').value;

      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        showMessage(
          'bad',
          'La contraseña debe tener al menos 8 caracteres.'
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          'bad',
          'Las contraseñas no coinciden.'
        );
        return;
      }

      saveButton.disabled = true;

      showMessage(
        '',
        'Guardando nueva contraseña...'
      );

      try {
        const { data: sessionData, error: sessionError } =
          await db.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          throw new Error(
            'La sesión de recuperación ha caducado.'
          );
        }

        const { data, error } = await db.auth.updateUser({
          password
        });

        if (error) throw error;

        if (!data.user) {
          throw new Error(
            'No se pudo confirmar el cambio de contraseña.'
          );
        }

        recoveryReady = false;
        form.hidden = true;

        showMessage(
          'ok',
          'Contraseña actualizada correctamente. Redirigiendo al acceso...'
        );

        await db.auth.signOut();

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2500);

      } catch (error) {
        console.error(
          'Error al cambiar contraseña:',
          error
        );

        showMessage(
          'bad',
          'No se pudo cambiar la contraseña. Solicita un nuevo enlace de recuperación.'
        );

        saveButton.disabled = false;
      }
    });

    initializeRecovery();
  </script>
</body>
</html>
