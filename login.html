
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b12">
  <title>Acceso · GPU LAB</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth">
    <div class="brand">GPU <b>LAB</b><small>2.0</small></div>

    <h1>Entra a tu clase</h1>
    <p>Ingresa tu identificador GPU y contraseña.</p>

    <form id="loginForm" novalidate>
      <label for="publicId">Identificador GPU</label>
      <input
        id="publicId"
        name="publicId"
        type="text"
        placeholder="GPU-XXXXXXXXXXXX"
        autocomplete="username"
        autocapitalize="characters"
        spellcheck="false"
        maxlength="16"
        required
      >

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Iniciar sesión</button>

      <div id="loginMsg" class="msg" role="status" aria-live="polite"></div>
    </form>

    <a class="back" href="register.html">Crear cuenta de estudiante</a>
  </main>

  <script src="vendor/supabase.js"></script>

  <script type="module">
    import { loginStudent } from './js/auth/student-login.js';

    const form = document.getElementById('loginForm');
    const out = document.getElementById('loginMsg');
    const btn = form.querySelector('button');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const publicId = document.getElementById('publicId').value;
      const password = document.getElementById('password').value;

      btn.disabled = true;
      out.className = 'msg';
      out.textContent = 'Verificando acceso…';

      try {
        const result = await loginStudent({ publicId, password });

        if (!result.ok) {
          out.className = 'msg bad';
          out.textContent = result.error;
          return;
        }

        out.className = 'msg ok';
        out.textContent = 'Acceso correcto. Entrando al laboratorio…';

        window.location.href = 'index.html';

      } catch (error) {
        console.error(error);
        out.className = 'msg bad';
        out.textContent = 'Ocurrió un error inesperado.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
